# Stack local de dependências externas para o DeskcommCRM.
#
# Sobe apenas a Evolution API (WhatsApp engine open-source) pra desenvolvimento.
# Postgres + Auth + Storage vêm do Supabase Cloud (ou supabase local CLI
# separadamente, conforme o time preferir).
#
# Uso:
#   1. Copie .env.example -> .env.local e preencha EVOLUTION_API_KEY
#   2. docker compose up -d
#   3. Instância + QR: crie a instância via API (EVOLUTION_INSTANCE_NAME) e pareie
#      o QR em http://localhost:8080/manager (porta 8080 mapeada no host).
#
# Em prod, a Evolution API roda no próprio stack do compose (docker-compose.prod.yml).
# docker-compose aqui é DEV ONLY.

version: "3.9"

services:
  evolution-api:
    # WhatsApp engine open-source (Evolution API v2) — substitui o WAHA.
    image: ${EVOLUTION_IMAGE:-atendai/evolution-api:v2.2.3}
    container_name: deskcomm-evolution-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_API_URL:-http://localhost:8080}
      # Chave global de autenticação (header `apikey`) que o app também usa.
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution-api-secret-key}
      # Webhook base URL — precisa ser pública (use ngrok/cloudflared em dev).
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria a própria Evolution e o webhook nunca chegaria. Porta 3003:
      # a stack da fusão é isolada do checkout principal (3001 é do gov-loop).
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/evolution
      # Cache local (a stack dev não sobe redis dedicado). Em prod usa-se o redis.
      CACHE_LOCAL_ENABLED: "true"
      CACHE_REDIS_ENABLED: "false"
      # Histórico das mensagens é responsabilidade do app/Supabase.
      DATABASE_ENABLED: "false"
      CORS_ORIGIN: "*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution-instances:/evolution/instances   # sessões pareadas (QR) — perder = re-parear
    healthcheck:
      # GET / responde 200 mesmo sem auth (healthcheck simples).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Postgres = Supabase (SUPABASE_DB_URL no
  # .env.local). Sobe junto da Evolution API: `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # dentro do container, localhost é o próprio worker — a Evolution API está
      # na rede do compose (serviço evolution-api, porta interna 8080). Sobrepõe o .env.local.
      EVOLUTION_API_URL: http://evolution-api:8080
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  evolution-instances:
